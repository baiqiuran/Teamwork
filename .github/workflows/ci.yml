name: Application checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# PR jobs never receive deployment or backup credentials.
permissions:
  contents: read

jobs:
  verified-artifact:
    name: Verified Linux artifact
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_CHANNEL: chromium
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Install browser prerequisites from the lockfile
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build and verify the exact checked-out commit
        run: node scripts/release-artifact.mjs build --commit "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/verified-artifact"
      - uses: actions/upload-artifact@v4
        with:
          name: application-${{ github.sha }}
          path: ${{ runner.temp }}/verified-artifact/
          if-no-files-found: error
          retention-days: 30
  host-control:
    name: Linux release and recovery
    needs: verified-artifact
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PLAYWRIGHT_CHANNEL: chromium
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: application-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
      - name: Verify upgrade, slots, crash recovery, offsite and restricted SSH
        run: node scripts/verify-host-control.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/host-proof"
