name: Production inspection
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      verify_notification:
        description: "Create an intentional notification-only failure; no server changes"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: daily-flow-inspection
  cancel-in-progress: false
jobs:
  inspect:
    if: vars.INSPECTION_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Verify native failure notification without changing the server
        if: inputs.verify_notification == true
        run: |
          echo 'Intentional notification delivery check; no production operation performed.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Pin inspection identity and host key
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/deploy-key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-known-hosts"
      - name: Check public HTTPS and trusted host diagnosis
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          DEPLOY_KEY_FILE: ${{ runner.temp }}/deploy-key
          DEPLOY_KNOWN_HOSTS: ${{ runner.temp }}/deploy-known-hosts
        run: node scripts/inspect-production.mjs
      - name: Remove runner credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy-key" "$RUNNER_TEMP/deploy-known-hosts"
